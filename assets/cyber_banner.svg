<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07040d" />
      <stop offset="50%" stop-color="#110924" />
      <stop offset="100%" stop-color="#0a0515" />
    </linearGradient>

    <!-- Neon Purple Gradient -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.35" />
    </pattern>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2e1065" stroke-width="0.7" opacity="0.4" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.7; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #a855f7); }
      100% { opacity: 0.7; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanlineAnim {
      0% { transform: translateY(0); }
      100% { transform: translateY(220px); }
    }
    @keyframes sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .title-text {
      font-family: 'Courier New', monospace, 'Segoe UI';
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 12px;
      fill: #ffffff;
      filter: drop-shadow(0 0 10px #c084fc);
    }
    .subtitle-text {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      fill: #c084fc;
    }
    .terminal-line {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #94a3b8;
    }
    .accent-purple { fill: #c084fc; font-weight: bold; }
    .accent-green { fill: #4ade80; font-weight: bold; }
    .cursor {
      animation: blink 1s infinite;
      fill: #a855f7;
    }
    .status-badge {
      animation: pulseGlow 3s infinite ease-in-out;
    }
  </style>

  <!-- Frame Background -->
  <rect width="900" height="220" rx="14" fill="url(#bgGrad)" />
  <rect width="900" height="220" rx="14" fill="url(#grid)" />
  <rect width="900" height="220" rx="14" fill="url(#scanlines)" />

  <!-- Outer Cyber Border -->
  <rect x="2" y="2" width="896" height="216" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" opacity="0.85" />

  <!-- Corner Brackets -->
  <path d="M 12 30 L 12 12 L 30 12" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <path d="M 888 30 L 888 12 L 870 12" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <path d="M 12 190 L 12 208 L 30 208" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <path d="M 888 190 L 888 208 L 870 208" fill="none" stroke="#c084fc" stroke-width="2.5" />

  <!-- Top Status Bar -->
  <g transform="translate(30, 28)">
    <circle cx="0" cy="0" r="4" fill="#a855f7" class="status-badge">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="16" cy="0" r="4" fill="#3b0764" />
    <circle cx="32" cy="0" r="4" fill="#3b0764" />
    <text x="50" y="4" class="subtitle-text">// SEC_KERNEL_v4.19 :: NODE_ONLINE</text>
    
    <text x="660" y="4" class="subtitle-text" text-anchor="end">SYS_ID: 0x7F_FAMEFASHION</text>
    <rect x="680" y="-8" width="160" height="18" rx="4" fill="#2e1065" stroke="#a855f7" stroke-width="0.8" />
    <text x="760" y="5" font-family="'Courier New', monospace" font-size="10" fill="#4ade80" font-weight="bold" text-anchor="middle">STATUS: ARMED</text>
  </g>

  <!-- Main Title Area -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <text class="title-text">FAMEFASHION</text>
    <line x1="-320" y1="20" x2="320" y2="20" stroke="url(#purpleGlow)" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Dynamic Live Terminal Readout -->
  <g transform="translate(45, 148)">
    <rect x="0" y="0" width="810" height="50" rx="8" fill="#0d071a" stroke="#3b0764" stroke-width="1" opacity="0.95" />
    
    <!-- Code prompt -->
    <text x="18" y="22" class="terminal-line">
      <tspan class="accent-purple">root@famefashion</tspan>:<tspan fill="#38bdf8">~#</tspan> ./engage_pipeline --target=<tspan fill="#ffffff">datawire.cc</tspan> --next=<tspan fill="#c084fc">veigram</tspan>
    </text>
    <text x="18" y="40" class="terminal-line">
      [<tspan class="accent-green">READY</tspan>] Vectors: <tspan fill="#e2e8f0">SQLi, WEBEXP, XSS_AUDIT, REVERSE_ENG, BINARY_DISASSEMBLY</tspan>
      <tspan class="cursor">_</tspan>
    </text>
  </g>

  <!-- Horizontal Glow Sweep -->
  <line x1="0" y1="120" x2="900" y2="120" stroke="#c084fc" stroke-width="1" opacity="0.15" />
</svg>
